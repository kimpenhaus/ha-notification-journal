<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=block" />
    <style>
      /* Frames for the raw screenshots: a browser window, a phone, or both as the README's opening picture. */
      html, body { margin: 0; background: transparent; font-family: Roboto, sans-serif; }
      body {
        --chrome: #e5e9f0; --chrome-edge: #d8dee9; --address: #eceff4; --address-text: #4c566a;
        --shadow: 0 28px 60px -18px rgba(46, 52, 64, 0.45), 0 0 0 1px rgba(46, 52, 64, 0.12);
      }
      body.dark {
        --chrome: #242933; --chrome-edge: #1d2129; --address: #2e3440; --address-text: #d8dee9;
        --shadow: 0 28px 60px -18px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 0, 0, 0.5);
      }
      #stage { display: inline-block; position: relative; padding: 40px 48px 64px; }
      .window { border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); background: var(--chrome); }
      .bar {
        height: 44px; display: grid; grid-template-columns: 96px 1fr 96px; align-items: center;
        border-bottom: 1px solid var(--chrome-edge);
      }
      .dots { display: flex; gap: 8px; padding-left: 18px; }
      .dots i { width: 12px; height: 12px; border-radius: 50%; }
      .dots i:nth-child(1) { background: #bf616a; }
      .dots i:nth-child(2) { background: #ebcb8b; }
      .dots i:nth-child(3) { background: #a3be8c; }
      .address {
        justify-self: center; min-width: 46%; padding: 6px 16px; border-radius: 8px; background: var(--address);
        color: var(--address-text); font-size: 13px; text-align: center; letter-spacing: 0.1px;
      }
      .window img, .phone img { display: block; }
      .phone {
        padding: 11px; border-radius: 52px; background: #1d2129; box-shadow: var(--shadow), inset 0 0 0 2px #4c566a;
      }
      .phone img { border-radius: 41px; }
      .hero .phone { position: absolute; right: 48px; bottom: 40px; }
      .hero .window { margin-right: 300px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      if (params.get("theme") === "dark") document.body.classList.add("dark");
      const stage = document.getElementById("stage");
      const image = async (name) => {
        const img = new Image();
        img.src = `raw/${name}.png`;
        await img.decode();
        img.width = img.naturalWidth / 2;
        img.height = img.naturalHeight / 2;
        return img;
      };
      const browser = async (name) => {
        const window = document.createElement("div");
        window.className = "window";
        window.innerHTML =
          '<div class="bar"><span class="dots"><i></i><i></i><i></i></span>' +
          '<span class="address">homeassistant.local:8123/notification-journal</span><span></span></div>';
        window.append(await image(name));
        return window;
      };
      const phone = async (name) => {
        const frame = document.createElement("div");
        frame.className = "phone";
        frame.append(await image(name));
        return frame;
      };
      const layout = params.get("layout");
      if (layout === "phone") stage.append(await phone(params.get("a")));
      else stage.append(await browser(params.get("a")));
      if (layout === "hero") {
        stage.classList.add("hero");
        stage.append(await phone(params.get("b")));
      }
      await document.fonts.ready;
      document.body.dataset.ready = "1";
    </script>
  </body>
</html>
