<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; height: 100%; }
      /* Home Assistant's default theme (frontend src/resources/theme), light and dark; the panel has no fallbacks. */
      body {
        font-family: Roboto, Noto, sans-serif;
        --ha-font-family-body: Roboto, Noto, sans-serif; --ha-font-family-code: monospace;
        --primary-color: #009ac7; --text-primary-color: #ffffff;
        --light-primary-color: #b3e5fc; --text-light-primary-color: #212121;
        --primary-background-color: #fafafa; --secondary-background-color: #e5e5e5;
        --card-background-color: #ffffff; --primary-text-color: #141414; --secondary-text-color: #5e5e5e;
        --disabled-text-color: #bdbdbd; --divider-color: rgba(0, 0, 0, 0.12); --shadow-color: rgba(0, 0, 0, 0.16);
        --app-header-background-color: #ffffff; --app-header-text-color: #141414;
        --app-header-border-bottom: 1px solid var(--divider-color);
        --success-color: #43a047; --error-color: #db4437; --warning-color: #ffa600; --info-color: #039be5;
        --color-1: #4269d0; --color-2: #f4bd4a; --color-3: #ff725c; --color-4: #6cc5b0; --color-5: #a463f2;
        --color-6: #ff8ab7;
        background: var(--primary-background-color);
      }
      body.dark {
        --primary-background-color: #111111; --secondary-background-color: #282828; --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --disabled-text-color: #6f6f6f;
        --divider-color: rgba(225, 225, 225, 0.12); --shadow-color: rgba(0, 0, 0, 0.48);
        --app-header-background-color: #1c1c1c; --app-header-text-color: #e1e1e1;
      }
    </style>
    <script src="readme-data.js"></script>
  </head>
  <body>
    <script type="module">
      const params = new URLSearchParams(location.search);
      if (params.get("theme") === "dark") document.body.classList.add("dark");
      const { records, facets, statistics } = window.MOCK;
      const originKey = (o) => o.entity_id ?? (o.integration ? `integration.${o.integration}` : o.kind);
      const archive = new Set();
      const matches = (r, m) =>
        (!m.status || r.status === m.status) && (!m.channel || r.channel === m.channel || r.group === m.channel) &&
        (!m.origin || originKey(r.origin) === m.origin) && (!m.tag || r.data?.data?.tag === m.tag) &&
        (!m.since || Date.parse(r.time) >= Date.parse(m.since)) && (!m.until || Date.parse(r.time) < Date.parse(m.until)) &&
        (!m.text || JSON.stringify([r.title, r.message, r.recipients]).toLowerCase().includes(m.text.toLowerCase()));
      const hass = {
        language: params.get("lang") ?? "de",
        locale: { language: params.get("lang") ?? "de", time_zone: "server", first_weekday: "monday" },
        config: { time_zone: "UTC" },
        user: { id: "user-alex", name: "Alex", is_admin: params.get("admin") !== "0" },
        dockedSidebar: "docked",
        states: { ...window.README_STATES },
        connection: {
          async sendMessagePromise(m) {
            if (m.type === "auth/sign_path") return { path: m.path };
            if (m.type.endsWith("/facets")) return facets;
            if (m.type.endsWith("/statistics")) return statistics(m);
            if (m.type.endsWith("/archive")) { for (const id of m.record_ids) m.archived === false ? archive.delete(id) : archive.add(id); return { changed: m.record_ids.length }; }
            if (m.type.endsWith("/delete")) { const i = records.findIndex((r) => r.id === m.record_id); records.splice(i, 1); return null; }
            let list = records.filter((r) => matches(r, m) && archive.has(r.id) === Boolean(m.archived));
            if (m.newest_first === false) list = [...list].reverse();
            let groups;
            if (m.group_by === "origin") {
              const key = (r) => originKey(r.origin);
              const rank = (r) => (r.origin.entity_id ? "0" + r.origin.entity_id : "1" + r.origin.kind);
              list = [...list].sort((x, y) => rank(x).localeCompare(rank(y)) || (m.newest_first === false ? x.time.localeCompare(y.time) : y.time.localeCompare(x.time)));
              groups = {};
              for (const r of list) groups[key(r)] = (groups[key(r)] ?? 0) + 1;
            }
            let days;
            if (m.days) {
              const counts = {};
              for (const r of list) counts[r.time.slice(0, 10)] = (counts[r.time.slice(0, 10)] ?? 0) + 1;
              const next = (day) => new Date(Date.parse(day) + 86400000).toISOString().slice(0, 10);
              days = Object.keys(counts).sort().map((day) => ({ day, since: `${day}T00:00:00+00:00`, until: `${next(day)}T00:00:00+00:00`, count: counts[day] }));
              if (m.newest_first !== false) days.reverse();
            }
            return { records: list.slice(m.offset, m.offset + m.limit), total: list.length, groups, days };
          },
          async subscribeMessage() { return async () => {}; },
        },
      };
      await import("./panel.js");
      const panel = document.createElement("notification-journal-panel");
      panel.narrow = params.get("narrow") === "1";
      panel.hass = hass;
      document.body.append(panel);
    </script>
  </body>
</html>
