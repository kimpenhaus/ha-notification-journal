name: release

on:
  push:
    branches: [main]
    tags: ["v*-beta.*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      # As a GitHub App, release-please's pull requests and releases trigger workflows: the CI runs on
      # the release pull request, and the published release starts the archive job.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  archive:
    # Every published release, by release-please or by hand.
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Build the panel
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Attach the integration to the release
        run: |
          scripts/package.sh "${TAG#v}"
          gh release upload "${TAG}" notification_journal.zip --clobber

  beta:
    # A tag v<version>-beta.<n> becomes a pre-release of that version; release-please leaves these tags alone.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Build the panel
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Publish the pre-release
        run: |
          scripts/package.sh "${TAG#v}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" notification_journal.zip --clobber
          else
            gh release create "${TAG}" notification_journal.zip --prerelease --verify-tag \
              --title "${TAG}" --notes "Pre-release for testing, built from ${GITHUB_SHA}."
          fi
