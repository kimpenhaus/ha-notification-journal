name: release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  archive:
    needs: release-please
    # A release by release-please (it raises no release event of its own) or one made by hand, e.g. a pre-release.
    if: ${{ always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'release') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Build the panel
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Attach the integration to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s custom_components/notification_journal/frontend/panel.js
          manifest=custom_components/notification_journal/manifest.json
          jq --arg version "${TAG#v}" '.version = $version' "${manifest}" > manifest.tmp && mv manifest.tmp "${manifest}"
          cd custom_components/notification_journal
          zip -r -q ../../notification_journal.zip . -x '__pycache__/*'
          cd ../..
          gh release upload "${TAG}" notification_journal.zip --clobber
