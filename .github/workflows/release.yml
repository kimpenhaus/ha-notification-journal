name: release

on:
  push:
    branches: [main]
    tags: ["v*-beta.*"]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  archive:
    needs: release-please
    # A release by release-please (it raises no release event of its own) or one made by hand.
    if: ${{ always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'release') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Build the panel
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Attach the integration to the release
        run: |
          scripts/package.sh "${TAG#v}"
          gh release upload "${TAG}" notification_journal.zip --clobber

  beta:
    # A tag v<version>-beta.<n> becomes a pre-release of that version; release-please leaves these tags alone.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Build the panel
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Publish the pre-release
        run: |
          scripts/package.sh "${TAG#v}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" notification_journal.zip --clobber
          else
            gh release create "${TAG}" notification_journal.zip --prerelease --verify-tag \
              --title "${TAG}" --notes "Pre-release for testing, built from ${GITHUB_SHA}."
          fi
