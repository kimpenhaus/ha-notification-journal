name: pr title

# Pull requests are squash-merged with their title as the commit message, and release-please builds
# releases and the changelog from those messages. A title it cannot parse would be skipped silently.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The types of release-please-config.json: feat → minor, fix/perf/revert → patch, others no release.
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            ci
            test
            refactor
            build
            style
          # Every title names the part it changes, e.g. "feat(statistics): …". Add new parts here.
          # docs: docs other than the README; ci: the CI jobs; tooling: build and lint tools.
          # No scope for tests: a repair of them is "test(<part>): …", not "fix(tests): …".
          requireScope: true
          scopes: |
            panel
            statistics
            store
            importer
            failures
            sources
            origin
            backup
            automations
            i18n
            readme
            screenshots
            release
            deps
            docs
            ci
            tooling
          # A digit for release-please's "chore(release): 0.5.0".
          subjectPattern: ^[a-z0-9].*[^.]$
          subjectPatternError: The summary "{subject}" must start with a lowercase letter or a digit and must not end with a period.
