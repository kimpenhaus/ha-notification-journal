name: renovate

on:
  pull_request:
    paths: [renovate.json, .github/workflows/renovate.yml]
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate.yml]

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:44.243.1@sha256:d4550ebc2bd3a67493cf33eaf170c67942af6d46d3a7de0771b420982ef6f409
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the Renovate configuration
        run: renovate-config-validator --no-global renovate.json
