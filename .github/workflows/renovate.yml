name: renovate

on:
  pull_request:
    paths: [renovate.json, .github/workflows/renovate.yml]
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate.yml]

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:44.257.8@sha256:68f58fa3b0e92875fa2f44c4ae02936186818b0170c2d39fe7261a2af5260f36
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the Renovate configuration
        run: renovate-config-validator --no-global renovate.json
