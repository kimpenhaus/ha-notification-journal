name: renovate

on:
  pull_request:
    paths: [renovate.json, .github/workflows/renovate.yml]
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate.yml]

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:44.252.7@sha256:da2082c34a7e8aee0fbf50122d71a052ba32ea5f51aeded502b742ad7bc9d5a2
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the Renovate configuration
        run: renovate-config-validator --no-global renovate.json
