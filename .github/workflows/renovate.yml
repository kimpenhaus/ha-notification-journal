name: renovate

on:
  pull_request:
    paths: [renovate.json, .github/workflows/renovate.yml]
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate.yml]

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:44.253.1@sha256:5a8ee52241aa6b81c7edec32dee68cad1edb29d3faca5cad2ed27cbcdaf2960b
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the Renovate configuration
        run: renovate-config-validator --no-global renovate.json
