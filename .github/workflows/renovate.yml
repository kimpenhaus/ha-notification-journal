name: renovate

on:
  pull_request:
    paths: [renovate.json, .github/workflows/renovate.yml]
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate.yml]

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: renovate/renovate:44.256.1@sha256:7138934c013df961d92acf6e3f1326f9dc705ed3d02e399ac0a3395d777182ff
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the Renovate configuration
        run: renovate-config-validator --no-global renovate.json
